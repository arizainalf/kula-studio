<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Kula Studio — Personal Trainer & Studio Manager</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('kulastudio-theme') || localStorage.getItem('trainlog-theme');
          var root = document.documentElement;
          var m = document.querySelector('meta[name="theme-color"]');
          if (t === 'light') {
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            if (m) m.setAttribute('content', '#F4F5F7');
          } else {
            root.classList.remove('light');
            root.removeAttribute('data-theme');
            if (m) m.setAttribute('content', '#141414');
          }

          // Instantly sync title & favicon from cached settings
          var s = localStorage.getItem('kulastudio-platform-settings-cache') || localStorage.getItem('trainlog-platform-settings-cache');
          if (s) {
            var p = JSON.parse(s);
            var appName = (p.app_name && p.app_name.toLowerCase().indexOf('trainlog') === -1) ? p.app_name : 'Kula Studio';
            document.title = appName + ' — ' + (p.app_tagline || 'Pro PT Manager');
            if (p.logo_url) {
              var fav = document.querySelector('link[rel~="icon"]');
              if (fav) {
                fav.href = p.logo_url;
                fav.type = p.logo_url.startsWith('data:image/svg') ? 'image/svg+xml' : 'image/png';
              }
              var apple = document.querySelector('link[rel="apple-touch-icon"]');
              if (apple) apple.href = p.logo_url;
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
